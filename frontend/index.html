<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>AI Model Marketplace</h1>

    <div>
        <h2>Token Balance</h2>
        <p id="tokenBalance">0 UGT</p>
    </div>

    <div>
        <h2>List a New Model</h2>
        <input type="text" id="modelName" placeholder="Model Name">
        <input type="text" id="modelDescription" placeholder="Description">
        <input type="number" id="modelPrice" placeholder="Price in UGT">
        <button id="listModelBtn">List Model</button>
        <button id="approveTokensBtn">Approve Tokens</button>
    </div>

    <div>
        <h2>Available Models</h2>
        <div id="modelListContainer"></div>
    </div>

    <div>
        <h2>Purchase or Rate a Model</h2>
        <input type="number" id="rating" placeholder="Rating (1-5)">
        <button id="purchaseModelBtn">Purchase Selected Model</button>
        <button id="rateModelBtn">Rate Selected Model</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
